[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[redirects]]
  from = "https://www.gxatoolbox.in/*"
  to = "https://gxatoolbox.in/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://gxatoolbox.netlify.app/*"
  to = "https://gxatoolbox.in/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/all-tools"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/favicon.ico"
  to = "/favicon-32x32.png"
  status = 301

[[redirects]]
  from = "/api/register.php"
  to = "/.netlify/functions/auth-register"
  status = 200

[[redirects]]
  from = "/api/login.php"
  to = "/.netlify/functions/auth-login"
  status = 200

[[redirects]]
  from = "/api/session.php"
  to = "/.netlify/functions/auth-session"
  status = 200

[[redirects]]
  from = "/api/logout.php"
  to = "/.netlify/functions/auth-logout"
  status = 200

[[redirects]]
  from = "/api/get-history.php"
  to = "/.netlify/functions/auth-history"
  status = 200

[[redirects]]
  from = "/api/save-job.php"
  to = "/.netlify/functions/auth-save-job"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self'"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=31536000"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    X-Permitted-Cross-Domain-Policies = "none"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
    Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Content-Type = "application/xml; charset=utf-8"
    Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
  for = "/site.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json; charset=utf-8"
    Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
  for = "/dashboard/*"
  [headers.values]
    Cache-Control = "private, no-store, max-age=0, must-revalidate"
    X-Robots-Tag = "noindex, nofollow, noarchive"

[[headers]]
  for = "/404.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    X-Robots-Tag = "noindex, nofollow, noarchive"

[[headers]]
  for = "/assets/app.js"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
  for = "/assets/style.css"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
  for = "/assets/tool-workspace.js"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
  for = "/assets/image-annotations.js"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
  for = "/assets/phase-one-studios.js"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
  for = "/favicon-*.png"
  [headers.values]
    Cache-Control = "public, max-age=86400, must-revalidate"

[[headers]]
  for = "/gxa-logo.png"
  [headers.values]
    Cache-Control = "public, max-age=86400, must-revalidate"

[[headers]]
  for = "/background-remover/assets/*.wasm"
  [headers.values]
    Content-Type = "application/wasm"
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/background-remover/assets/*.js"
  [headers.values]
    Content-Type = "application/javascript; charset=utf-8"
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/background-remover/assets/*.css"
  [headers.values]
    Content-Type = "text/css; charset=utf-8"
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/background-remover/vendor/ort/*.wasm"
  [headers.values]
    Content-Type = "application/wasm"
    Cache-Control = "public, max-age=604800, must-revalidate"

[[headers]]
  for = "/background-remover/vendor/ort/*.mjs"
  [headers.values]
    Content-Type = "application/javascript; charset=utf-8"
    Cache-Control = "public, max-age=604800, must-revalidate"

[[headers]]
  for = "/background-remover/models/*.onnx"
  [headers.values]
    Content-Type = "application/octet-stream"
    Cache-Control = "public, max-age=86400, must-revalidate"

[[headers]]
  for = "/background-remover/models/*.json"
  [headers.values]
    Content-Type = "application/json; charset=utf-8"
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/assets/vendor/onnxruntime-web/*.wasm"
  [headers.values]
    Content-Type = "application/wasm"
    Cache-Control = "public, max-age=604800, must-revalidate"

[[headers]]
  for = "/assets/vendor/qpdf/*.wasm"
  [headers.values]
    Content-Type = "application/wasm"
    Cache-Control = "public, max-age=604800, must-revalidate"

[[headers]]
  for = "/assets/vendor/onnxruntime-web/*.mjs"
  [headers.values]
    Content-Type = "application/javascript; charset=utf-8"
    Cache-Control = "public, max-age=604800, must-revalidate"

[[headers]]
  for = "/assets/vendor/onnxruntime-web/*.js"
  [headers.values]
    Content-Type = "application/javascript; charset=utf-8"
    Cache-Control = "public, max-age=604800, must-revalidate"

[[headers]]
  for = "/assets/models/background-remover/*.onnx"
  [headers.values]
    Content-Type = "application/octet-stream"
    Cache-Control = "public, max-age=86400, must-revalidate"

[[headers]]
  for = "/assets/models/background-remover/*.json"
  [headers.values]
    Content-Type = "application/json; charset=utf-8"
    Cache-Control = "public, max-age=3600"
